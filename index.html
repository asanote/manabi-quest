<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まなびクエスト</title>
<meta name="description" content="あそびながら 学べる ゲームあつめ">
<meta name="theme-color" content="#f5f9f7">
<link rel="icon" href="bunsu-monster/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<script data-goatcounter="https://asanote.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>
:root{
  --paper:#f5f9f7; --grid:#d5e7e2; --ink:#1d2433; --muted:#566176; --card:#ffffff; --card-2:#eef5ff;
  --red:#e03a3e; --marker:#ffe14d; --marker-2:#fff3a8; --info:#2f7fd1;
  --font-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --font-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif;
  color-scheme:light;
}
html,body{background-color:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.app{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{margin:0;text-align:center;font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,9vw,3rem);letter-spacing:.04em;line-height:1.2}
.lead{margin:6px 0 24px;text-align:center;font-weight:700}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.game{display:flex;gap:14px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px 16px;
  box-shadow:0 5px 0 var(--ink);color:inherit;text-decoration:none;transition:transform .08s,box-shadow .08s}
.game:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.game:focus-visible{outline:3px solid var(--info);outline-offset:3px}
.game img{width:84px;height:84px;flex-shrink:0;border:2px solid var(--ink);border-radius:14px;background:var(--card-2)}
.game h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem;line-height:1.3}
.game p{margin:4px 0 0;font-size:.9rem;font-weight:700;color:var(--muted)}
.tag{display:inline-block;margin-top:6px;font-size:.75rem;font-weight:900;padding:.1em .7em;border-radius:999px;border:2px solid var(--ink);background:var(--marker-2)}
.note{margin:28px 0 0;font-size:.8rem;font-weight:700;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="app">
  <h1>まなびクエスト</h1>
  <p class="lead">あそびながら 学ぼう！</p>
  <div class="games">
    <a class="game" href="bunsu-monster/index.html">
      <img src="bunsu-monster/icon.svg" alt="">
      <div>
        <h2>ぶんすうモンスター</h2>
        <p>分数の もんだいに せいかいして、モンスターを つかまえよう！</p>
        <span class="tag">小学4・5年・分数</span>
      </div>
    </a>
  </div>
  <p class="note">ご意見・ご感想や不具合のご連絡は<a href="https://docs.google.com/forms/d/e/1FAIpQLSfPDjxXbECH0sCm5_IXJuRrCfAkvV_BUM3S9tyjVqo6W8EDqw/viewform" target="_blank" rel="noopener">こちらのフォーム</a>からお送りください。<br>遊ばれた回数を知るためにアクセス解析（GoatCounter）を使っています。Cookieは使わず、個人を特定する情報は集めません。</p>
</main>
</body>
</html>
